name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalacja
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Wysyłka FTP na Hostingera
        env:
          FTP_SERWER: ${{ secrets.FTP_SERWER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_HASLO }}
        run: |
          test -f web/out/index.html || { echo "Brak web/out/index.html"; exit 1; }
          HOST=$(printf '%s' "$FTP_SERWER" | tr -d '[:space:]' | sed -E 's#^(s?ftps?://)##; s#/.*$##')
          USR=$(printf '%s' "$FTP_USER" | tr -d '[:space:]')
          [ -n "$HOST" ] || { echo "Pusty sekret FTP_SERWER"; exit 1; }
          [ -n "$USR" ] || { echo "Pusty sekret FTP_USER"; exit 1; }
          [ -n "$LFTP_PASSWORD" ] || { echo "Pusty sekret FTP_HASLO"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Główne konto FTP Hostingera ma w katalogu głównym folder "domains".
          # Osobne konto dla ypemedia.com startuje od razu w public_html.
          ROOT=$(lftp -u "$USR" --env-password "$HOST" -e "set ftp:ssl-allow no; set net:max-retries 2; cls -1 /; bye")
          echo "$ROOT"
          [ -n "$ROOT" ] || { echo "Nie udało się odczytać katalogu na serwerze"; exit 1; }
          if echo "$ROOT" | grep -qxE '/?(domains|public_html)/?'; then
            TARGET=/domains/ypemedia.com/public_html/
          else
            TARGET=/
          fi
          echo "Cel na serwerze: $TARGET"
          lftp -u "$USR" --env-password "$HOST" -e "set ftp:ssl-allow no; set net:max-retries 2; mirror -R --delete --verbose --exclude-glob .well-known/ web/out/ $TARGET; bye"
